# Included from every location block: nginx's add_header is NOT inherited
# when a location defines its own add_header, so keeping them here makes
# sure no response loses them.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# No 'unsafe-eval': JSX is precompiled at build time. 'unsafe-inline' for
# scripts remains only for the tiny theme bootstrap in index.html and Turnstile.
# unpkg/jsdelivr are NOT used by the app itself; they are kept so the
# playground's srcdoc iframe (which inherits this CSP) can still load
# libraries from those CDNs, as it could before the rewrite.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://api.github.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self';" always;
