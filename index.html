<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Poets Society - Collaborate & Create</title>
    <meta name="description" content="A collaborative platform for developers and creative coders to discover, showcase, and collaborate on coding projects.">
    <link rel="canonical" href="https://codepoetssociety.info">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://codepoetssociety.info">
    <meta property="og:title" content="Code Poets Society - Collaborate & Create">
    <meta property="og:description" content="A collaborative platform for developers and creative coders to discover, showcase, and collaborate on coding projects.">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Code Poets Society - Collaborate & Create">
    <meta name="twitter:description" content="A collaborative platform for developers and creative coders to discover, showcase, and collaborate on coding projects.">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=JetBrains+Mono:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Cloudflare Turnstile. onerror lets the app tell the user immediately
         when a content blocker prevents the widget from loading. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer onerror="window.__turnstileLoadFailed = true"></script>
    <!-- Apply saved theme before first paint to avoid a light-mode flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* storage unavailable */ }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
