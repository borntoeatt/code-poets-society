apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-poets-society
spec:
  replicas: 3  # Will be managed by HPA
  selector:
    matchLabels:
      app: code-poets-society
  template:
    metadata:
      labels:
        app: code-poets-society
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user in nginxinc/nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root nginx bind port 80, so the Service and the
        # rollout from the previous root-based image stay unchanged.
        # This is a "safe" namespaced sysctl (allowed by default since k8s 1.22).
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: website
        # Pinned by digest so the running image is exactly what CI scanned.
        # The line below is rewritten automatically by the "Docker image" job
        # in .github/workflows/docker.yml after each successful push to main;
        # Argo CD then syncs the new digest. Do not edit by hand unless the
        # workflow is broken.
        image: dporkov/code-poets-society@sha256:931810f99bd72fe3ebc6ad9fa36b47be1059b369cfda155a5fb330be5f13db8b
        # IfNotPresent is correct with digest-pinned images — the digest
        # already guarantees content, no need to re-pull on every restart.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # nginx-unprivileged writes its pid and temp files under /tmp only.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
