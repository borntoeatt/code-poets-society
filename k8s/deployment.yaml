apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-poets-society
spec:
  # No `replicas` here on purpose: the HPA (k8s/hpa.yaml, min 3) owns the
  # count. Committing a number would make every Argo CD sync reset the
  # Deployment to it mid-scale-up. Argo applies with ServerSideApply, and the
  # HPA's scale subresource co-owns spec.replicas, so dropping the field keeps
  # the live count (verified with a server-side dry run before removing it).
  # If Argo is ever switched to client-side apply, add ignoreDifferences on
  # /spec/replicas to the Application first (see SETUP-GUIDE.md).
  selector:
    matchLabels:
      app: code-poets-society
  # Bring all new pods up before removing any old one: each image only
  # carries its own hashed assets, so the mixed old/new window during a
  # rollout is when a visitor can get a 404 for index-<hash>.js.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: code-poets-society
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user in nginxinc/nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root nginx bind port 80, so the Service and the
        # rollout from the previous root-based image stay unchanged.
        # This is a "safe" namespaced sysctl (allowed by default since k8s 1.22).
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: website
        # Pinned by digest so the running image is exactly what CI scanned.
        # The line below is rewritten automatically by the "Docker image" job
        # in .github/workflows/docker.yml after each successful push to main;
        # Argo CD then syncs the new digest. Do not edit by hand unless the
        # workflow is broken.
        image: dporkov/code-poets-society@sha256:949863cbe5017a8324e6f036ec6bb3711e96c02a487edcc5f789a05cebd4a8f8
        # IfNotPresent is correct with digest-pinned images — the digest
        # already guarantees content, no need to re-pull on every restart.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # nginx-unprivileged writes its pid and temp files under /tmp only.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
