apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-poets-society
spec:
  replicas: 3  # Will be managed by HPA
  selector:
    matchLabels:
      app: code-poets-society
  template:
    metadata:
      labels:
        app: code-poets-society
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user in nginxinc/nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: website
        # Pinned to a specific manifest-list digest (multi-arch index).
        # Pinning by digest makes the deployment fully reproducible —
        # the image kubelet pulls today is byte-identical to what runs
        # in a year. Bump this line manually when pushing a new build:
        #   docker buildx imagetools inspect borntoeatt/code-poets-society:latest
        # and replace the @sha256:... with the new index digest.
        image: borntoeatt/code-poets-society@sha256:931810f99bd72fe3ebc6ad9fa36b47be1059b369cfda155a5fb330be5f13db8b
        # IfNotPresent is correct with digest-pinned images — the digest
        # already guarantees content, no need to re-pull on every restart.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # nginx-unprivileged writes its pid and cache under /tmp only.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
