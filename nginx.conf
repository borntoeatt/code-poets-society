server {
    # Non-root bind on 80: see the note in the Dockerfile.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets: cache forever. No `always` on Cache-Control: nginx
    # then adds it to 2xx/3xx only, so a transient 404 during a rollout (old
    # pod, new hash) is never cached for a year by browsers or Cloudflare.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Well-known static files must never fall through to the SPA shell
    # (a robots.txt that is HTML is invalid; a 200 HTML favicon is a soft-404).
    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # SPA shell: always revalidate so deploys are picked up immediately.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
