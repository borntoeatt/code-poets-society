name: Supabase keep-alive

# Free-tier Supabase projects are paused after ~7 days without activity.
# A lightweight query twice a week keeps the project awake.
on:
  schedule:
    - cron: '0 9 * * 1,4'   # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch:

permissions:
  actions: write   # needed to re-enable this workflow (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set SUPABASE_URL and SUPABASE_ANON_KEY repository secrets." >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          case "$code" in 2*) ;; *) exit 1 ;; esac

      # GitHub disables scheduled workflows in public repos after 60 days
      # without commits. Re-enabling from inside the run resets that timer.
      - name: Reset GitHub's 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
