name: Build and Push Docker Image

# Actions are pinned to full commit SHAs (a tag can be moved to malicious code;
# a SHA cannot). The trailing comment is the release it corresponds to;
# Dependabot (.github/dependabot.yml) keeps both up to date.

on:
  push:
    branches: [main, dev]
    # Changes that cannot affect the image. KEEP IN SYNC with the pathspec in
    # the "Pin new digest" step below.
    paths-ignore:
      - 'k8s/**'      # manifest-only changes (incl. the digest bump below) need no image
      - '**.md'
      - 'supabase/**' # edge function: checked by edge-function.yml, deployed separately
      - '.github/dependabot.yml'
      - '.github/workflows/edge-function.yml'
      - '.github/workflows/supabase-keepalive.yml'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'k8s/**'
      - '**.md'
      - 'supabase/**'
      - '.github/dependabot.yml'
      - '.github/workflows/edge-function.yml'
      - '.github/workflows/supabase-keepalive.yml'

permissions:
  contents: read

env:
  # Fixed image name (must match k8s/deployment.yaml). Deliberately NOT
  # derived from DOCKER_USERNAME, so the login account can change without
  # silently pushing to a different repository.
  IMAGE: dporkov/code-poets-society

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit and contract tests
        run: npm test
      # Production dependencies only: dev tooling never ships in the image.
      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - run: npm run build

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    # Reduces overlap between runs. Note GitHub keeps only one PENDING run
    # per group (older pending runs are cancelled), and runs enter the group
    # when `check` finishes, not in commit order. Correct ordering therefore
    # comes from the pin step's newer-commit guard, not from this queue.
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # to commit the new image digest into k8s/deployment.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build ONCE into the local daemon. The exact image that is scanned below
      # is the one that gets pushed — no rebuild between scan and push.
      # The runtime stage is excluded from the layer cache so `apk upgrade`
      # really runs on every build instead of replaying a stale cached layer.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime

      - name: Scan image (fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest"

      # Argo CD deploys whatever digest is in k8s/deployment.yaml on main, so
      # record the freshly pushed image there. A push made with GITHUB_TOKEN
      # does not trigger workflows, and k8s/** is path-ignored anyway.
      - name: Pin new digest in k8s/deployment.yaml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Fetch main's history down to this run's commit (the checkout is
            # shallow at GITHUB_SHA, so this only pulls the newer commits).
            git fetch -q origin main
            # If main has moved on with an image-producing change (anything
            # not in paths-ignore above), that commit's own run pins its newer
            # image. Pinning ours now would roll production back, e.g. on a
            # re-run of an old failed run.
            newer=$(git log --format=%H "$GITHUB_SHA..FETCH_HEAD" -- . \
              ':!k8s' ':!*.md' ':!supabase' \
              ':!.github/dependabot.yml' \
              ':!.github/workflows/edge-function.yml' \
              ':!.github/workflows/supabase-keepalive.yml')
            if [ -n "$newer" ]; then
              echo "A newer image-producing commit is on main; its run pins the digest. Skipping."
              exit 0
            fi
            # Edit main's CURRENT copy of the file (not the trigger commit's)
            # so there is never a conflict on the digest line.
            git checkout -q --force FETCH_HEAD
            sed -i -E "s|(image: [^@]+)@sha256:[0-9a-f]{64}|\1@${DIGEST}|" k8s/deployment.yaml
            if git diff --quiet -- k8s/deployment.yaml; then
              echo "Digest already pinned; nothing to commit."
              exit 0
            fi
            git commit -q -m "k8s: deploy ${GITHUB_SHA::7} (${DIGEST::19}…)" -- k8s/deployment.yaml
            # A concurrent push to main rejects this one; loop and redo it on the new tip.
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved); retrying ($attempt/3)."
          done
          echo "Could not pin the digest after 3 attempts." >&2
          exit 1
