name: Edge function checks

# The verify-turnstile function holds the service-role key and is the only
# server-side code in the repo, so it gets its own type-check and lint.
# It is deployed with the Supabase CLI (see SETUP-GUIDE.md), not by CI.

on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - '.github/workflows/edge-function.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - '.github/workflows/edge-function.yml'

permissions:
  contents: read

jobs:
  deno:
    name: Deno check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/verify-turnstile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # --frozen fails if deno.lock would change, i.e. if the resolved
      # dependency tree differs from the one that was reviewed and committed.
      - run: deno check --frozen index.ts
      - run: deno lint
